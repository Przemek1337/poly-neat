[project]
name = "polyneat"
version = "0.1.0"
description = "Neuroevolution library for variable-topology and deep evolutionary algorithms"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "tensorboard>=2.15",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "tqdm>=4.66",
    "rich>=13.7",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
gymnasium = ["gymnasium>=0.29"]
dev = ["ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polyneat"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
