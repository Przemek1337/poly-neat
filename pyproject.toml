[project]
name = "polyneat"
version = "0.1.0"
description = "Neuroevolution library for variable-topology and deep evolutionary algorithms"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "tensorboard>=2.15",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "tqdm>=4.66",
    "rich>=13.7",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
gymnasium = ["gymnasium>=0.29"]
dev = ["ruff>=0.4"]

# Image decoding and reference metric implementations, needed by the image
# benchmarks (pediatric pneumonia) and not by the core library. Versions are
# pinned rather than bounded: AUROC and average precision come from
# scikit-learn, and a metric implementation that changes under a result series
# would make its numbers incomparable. Every run also records the version it
# actually imported, so the pin is checkable from the artifacts alone.
benchmark = [
    "scikit-learn==1.9.0",
    "pillow==12.3.0",
    # torchvision ships compiled operators against one torch ABI. Installing it
    # unpinned pulls a newer torch alongside it and every torchvision call then
    # fails with "operator torchvision::nms does not exist", so the pair is
    # pinned together: 0.27.x matches torch 2.12.x.
    "torchvision==0.27.1",
]

# PyTorch z CUDA pobierany jest z indeksu PyTorcha, nie z PyPI: domyślne koło `torch`
# z PyPI jest zbudowane bez CUDA, przez co `torch.cuda.is_available()` zwraca False
# i ścieżka `--gpu` kończy się błędem.
#
# Docelowe środowisko to serwer z kartami NVIDIA L4, sterownik 570.86.10 (CUDA 12.8),
# Python 3.11. Wybór indeksu cu126 dla tego zestawu:
#
#   indeks   torch cp311 / linux        uwagi
#   cu126    do 2.13.0, w tym 2.12.1    runtime 12.6 < 12.8 sterownika — zgodność gwarantowana
#   cu128    maksymalnie 2.11.0         dokładne trafienie w sterownik, ale cofa wersję torcha
#   cu129    do 2.13.0                  runtime nowszy niż sterownik, tylko minor version compatibility
#   cu130    do 2.13.0                  WYMAGA sterownika 580+, na 570.86.10 nie uruchomi się
#
# `nvidia-smi` raportuje maksymalną wersję CUDA obsługiwaną przez sterownik, a nie wymaganą,
# więc build zbudowany pod starszy runtime działa na nowszym sterowniku. Odwrotny kierunek
# nie jest bezpieczny — stąd odrzucenie cu130.
#
# Marker ogranicza indeks CUDA do Linuksa. Na stacjach roboczych (Windows/macOS) instaluje się
# zwykłe koło z PyPI, więc `uv sync` do pracy nad kodem i testami nie ciągnie ~2.5 GB bibliotek
# CUDA. Żeby mieć CUDA także lokalnie, wystarczy usunąć marker.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polyneat"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Static type checking is scoped to the packages added for the image
# benchmarks. The rest of the repository predates it and is not retyped here:
# the point is that new and changed interfaces are checked, not that unrelated
# modules get rebuilt. Ruff and annotations alone do not perform this check.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = [
    "polyneat/training",
    "polyneat/evaluators/binary_predictions.py",
    "polyneat/evaluators/binary_classification_metrics.py",
    "polyneat/evaluators/binary_inference.py",
    "polyneat/evaluators/binary_auroc_evaluator.py",
    "polyneat/evaluators/scored_candidate_evaluator.py",
    "polyneat/evaluators/multiclass_accuracy_evaluator.py",
    "polyneat/evaluators/decision_threshold.py",
    "polyneat/evaluators/bootstrap_confidence_intervals.py",
    "polyneat/runner/evaluation_record.py",
    "polyneat/runner/run_checkpoint.py",
    "polyneat/runner/search_session.py",
    "polyneat/runner/resumable_search.py",
    "polyneat/runner/wall_clock_budget.py",
    "polyneat/nn/fixed_convolutional_network.py",
    "polyneat/nn/pretrained_image_classifier.py",
    "polyneat/algorithms/exact/exact_parameter_reset.py",
    "polyneat/algorithms/exact/exact_image_input_adapter.py",
    "examples/_benchmark",
    "examples/pediatric_pneumonia",
    "examples/mnist/_execution.py",
    "examples/mnist/_profiles.py",
    "examples/mnist/_protocol.py",
    "examples/mnist/_methods.py",
    "examples/mnist/_freeze.py",
    "examples/mnist/benchmark_deepneat.py",
    "examples/mnist/benchmark_exact.py",
    "examples/cifar10/_execution.py",
    "examples/cifar10/_profiles.py",
    "examples/cifar10/_protocol.py",
    "examples/cifar10/_methods.py",
    "examples/cifar10/benchmark_deepneat.py",
    "examples/cifar10/_freeze.py",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=1.11",
]
