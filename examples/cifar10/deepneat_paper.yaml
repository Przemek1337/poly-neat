# DeepNEAT CIFAR-10 protocol from Liang (2018), Chapter 3, Table 3.1.
# Population 100, 60 generations, 8 fitness-training epochs, 42.5k/7.5k
# evolution split, and 300 final epochs. The global and node-level search
# intervals below are chromosome genes, not fixed trainer settings. Parameters
# not reported by the source (batch size, mutation rates, compatibility
# threshold, Gaussian step size and random seed) are explicit reconstruction
# choices and must not be presented as published values.

population_size: 100
number_of_input_nodes: 1
number_of_output_nodes: 10
number_of_classes: 10
random_seed: 42
device_for_phenotype_evaluation: cpu

input_image_channels: 3
input_image_height: 32
input_image_width: 32

training_epochs_per_evaluation: 8
training_learning_rate: 0.001
training_batch_size: 128
use_deterministic_training_algorithms: false

number_of_generations: 60
final_training_epochs: 300
maximum_training_samples: 50000
maximum_test_samples: 10000
validation_fraction: 0.15

available_filter_counts: [32, 256]
number_of_filters_min: 32
number_of_filters_max: 256
available_kernel_sizes: [1, 3]
available_dense_unit_counts: [64, 128, 256]
dropout_rate_min: 0.0
dropout_rate_max: 0.7
initial_weight_scaling_min: 0.0
initial_weight_scaling_max: 2.0
available_batch_normalization_options: [false]

global_learning_rate_min: 0.0001
global_learning_rate_max: 0.1
global_momentum_min: 0.68
global_momentum_max: 0.99
global_hue_shift_degrees_min: 0.0
global_hue_shift_degrees_max: 45.0
global_saturation_value_shift_min: 0.0
global_saturation_value_shift_max: 0.5
global_saturation_value_scale_min: 0.0
global_saturation_value_scale_max: 0.5
global_cropped_image_size_min: 26
global_cropped_image_size_max: 32
global_spatial_scaling_min: 0.0
global_spatial_scaling_max: 0.3
available_horizontal_flip_options: [false, true]
available_variance_normalization_options: [false, true]
available_nesterov_momentum_options: [false, true]

probability_of_add_layer_node_mutation: 0.15
probability_of_add_tensor_edge_mutation: 0.15
probability_of_toggle_tensor_edge_mutation: 0.05
probability_of_layer_hyperparameter_mutation: 0.5
probability_of_global_hyperparameter_mutation: 0.5
probability_of_new_conv_layer: 1.0

compatibility_distance_coefficient_excess_c1: 1.0
compatibility_distance_coefficient_disjoint_c2: 1.0
# DeepNEAT's sources say only that speciation uses a similarity metric. They do
# not define a layer-hyperparameter distance, and tensor edges have no weights,
# so the source profile disables PolyNEAT's optional c3 reconstruction.
compatibility_distance_coefficient_weight_difference_c3: 0.0
compatibility_distance_threshold: 3.0

probability_of_crossover_vs_mutation_only: 0.75
probability_of_inheriting_from_fitter_parent_for_matching_genes: 0.5
# The publication reports no parameter-count fitness cutoff.
maximum_total_parameter_count: null
