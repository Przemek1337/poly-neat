# PolyNEAT - Visual Discrimination via HyperNEAT (Stanley et al. 2009, Section 4).
# Evolves a CPPN that paints the weights of a two-sheet "sandwich" substrate:
# an R x R visual-field input grid wired directly to an R x R target-field output
# grid, both sharing the coordinate square [-1, 1]^2. The correct solution is a
# translation-invariant local receptive field (weight high when source and target
# coordinates are close) - a Gaussian of coordinate difference, which a connective
# CPPN represents compactly and reuses across the whole grid.

population_size: 150
# The CPPN's own I/O is fixed: 4 coordinate inputs (x1, y1, x2, y2), 1 output.
number_of_input_nodes: 4
number_of_output_nodes: 1
random_seed: 42
device_for_phenotype_evaluation: cpu

# Substrate description (2-D sandwich, built in the example script for a 7x7 field).
substrate_input_layer_size: 49
substrate_hidden_layer_sizes: []
substrate_output_layer_size: 49
substrate_coordinate_range_min: -1.0
substrate_coordinate_range_max: 1.0
include_substrate_bias_node: true
# identity output: each target node is the weighted SUM of its inputs, so the
# node whose neighborhood accumulates the most active pixels wins the argmax.
substrate_node_activation_function: identity

# CPPN output -> substrate weight interpretation (paper Table 1).
weight_expression_threshold: 0.2
max_substrate_connection_weight_magnitude: 3.0

# CPPN genetics (standard NEAT). CPPN weight range -3..3 per the paper.
probability_of_add_node_mutation: 0.05
probability_of_add_connection_mutation: 0.10
probability_of_weight_perturbation: 0.90
probability_of_weight_replacement: 0.10
probability_of_toggle_connection_enabled: 0.01
initial_weight_range_min: -3.0
initial_weight_range_max: 3.0
weight_perturbation_strength_sigma: 0.5

# CPPN function set (paper: Gaussian, Sigmoid, Sine, Absolute value, Linear).
# Gaussian is the key function here: it turns a coordinate difference into a
# localized receptive field, the regularity the task rewards.
available_activation_functions: [sigmoid, gaussian, sine, absolute_value, identity]
default_activation_function_for_hidden_nodes: gaussian
default_activation_function_for_output_nodes: identity

# Speciation and lifecycle (unchanged NEAT machinery over CPPNs).
compatibility_distance_coefficient_excess_c1: 1.0
compatibility_distance_coefficient_disjoint_c2: 1.0
compatibility_distance_coefficient_weight_difference_c3: 0.4
compatibility_distance_threshold: 3.0
species_elitism_count: 1
species_stagnation_generations_limit: 15
minimum_species_size_for_elitism: 5
probability_of_crossover_vs_mutation_only: 0.75
probability_of_inheriting_from_fitter_parent_for_matching_genes: 0.50
probability_of_interspecies_mating: 0.001
tournament_size_for_parent_selection: 3
species_survival_fraction_for_reproduction: 0.2
