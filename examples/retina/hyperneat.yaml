# PolyNEAT – plain HyperNEAT on the retina problem (baseline for LEO)
#
# Every CPPN genetics parameter is IDENTICAL to leo.yaml — the differences come
# down solely to how HyperNEAT differs from HyperNEAT-LEO:
#   * the CPPN has 4 inputs (x1, y1, x2, y2) and 1 output (weight), no deltas and no LEO,
#   * a connection's existence is decided by weight magnitude, not a separate output,
#   * the initial population is plain, without seeded locality,
#   * the substrate is described by layer sizes, so nodes are distributed UNIFORMLY.
#
# That last point is deliberate: the baseline is meant to show what HyperNEAT does
# without any geometric help. HyperNEATConfig knows no explicit coordinates.

population_size: 150
number_of_input_nodes: 4      # x1, y1, x2, y2
number_of_output_nodes: 1     # weight
random_seed: 42
device_for_phenotype_evaluation: cpu

initial_population_strategy: fully_connected

substrate_input_layer_size: 8
substrate_hidden_layer_sizes: [8]
substrate_output_layer_size: 2
substrate_coordinate_range_min: -1.0
substrate_coordinate_range_max: 1.0
include_substrate_bias_node: true
substrate_node_activation_function: steepened_sigmoid
weight_expression_threshold: 0.2
max_substrate_connection_weight_magnitude: 3.0

# CPPN genetics — identical to leo.yaml
initial_weight_range_min: -3.0
initial_weight_range_max: 3.0
probability_of_add_node_mutation: 0.03
probability_of_add_connection_mutation: 0.05
probability_of_genome_weight_mutation: 0.80
probability_of_weight_perturbation: 0.90
probability_of_weight_replacement: 0.10
probability_of_toggle_connection_enabled: 0.01
weight_perturbation_magnitude: 0.5

available_activation_functions: ["sigmoid", "gaussian", "sine", "absolute_value", "identity"]
default_activation_function_for_hidden_nodes: sigmoid
default_activation_function_for_output_nodes: identity

compatibility_distance_coefficient_excess_c1: 1.0
compatibility_distance_coefficient_disjoint_c2: 1.0
compatibility_distance_coefficient_weight_difference_c3: 0.4
compatibility_distance_threshold: 3.0

species_elitism_count: 1
species_stagnation_generations_limit: 15
minimum_species_size_for_elitism: 6

probability_of_crossover_vs_mutation_only: 0.75
probability_of_inheriting_from_fitter_parent_for_matching_genes: 0.50
probability_of_interspecies_mating: 0.001

tournament_size_for_parent_selection: 3
species_survival_fraction_for_reproduction: 0.2
