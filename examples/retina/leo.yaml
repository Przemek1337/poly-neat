# PolyNEAT – HyperNEAT-LEO on the retina problem
#
# The task is modular by definition: the answer "object on the left" does not
# depend on any pixel on the right (Kashtan & Alon, 2005). LEO seeds locality,
# so generation 0 consists of two disjoint hemispheres, each with its own
# output (Verbancsics & Stanley, 2011).
#
# SUBSTRATE GEOMETRY — the gap between hemispheres is NECESSARY.
# With eight nodes spread uniformly over [-1, 1], within-hemisphere distances
# reach 0.857 while between-hemisphere distances start at 0.286: the ranges
# overlap and no locality threshold can separate them.
#
# With the source's seeding constants (w=0.6, g=2.0, b=-1) the threshold falls at
# sqrt(ln 2)/0.6 = 1.388. Clusters at ±0.75…±1.0 give <= 0.25 within
# and >= 1.50 between — the threshold sits cleanly in between.
#
# Input-layer pixel order, following the RetinaProblemEvaluator docstring:
#   0,1 = outer left column of the left block (top, bottom)
#   2,3 = inner column of the left block
#   4,5 = inner column of the right block
#   6,7 = outer right column of the right block
# This way the x coordinate carries the column structure that the task rule reads.

population_size: 150
number_of_input_nodes: 4      # x1, y1, x2, y2 — as in plain HyperNEAT
number_of_output_nodes: 2     # weight, LEO
random_seed: 42
device_for_phenotype_evaluation: cpu

initial_population_strategy: leo_seeded

substrate_layer_x_coordinates:
  - [-1.0, -0.9167, -0.8333, -0.75, 0.75, 0.8333, 0.9167, 1.0]
  - [-1.0, -0.9167, -0.8333, -0.75, 0.75, 0.8333, 0.9167, 1.0]
  - [-0.875, 0.875]
substrate_bias_x_coordinate: 0.0
substrate_coordinate_range_min: -1.0
substrate_coordinate_range_max: 1.0
include_substrate_bias_node: true
substrate_node_activation_function: steepened_sigmoid
max_substrate_connection_weight_magnitude: 3.0

# Expression rule and locality seeding.
#   LEO = tanh(g * exp(-(w * d)^2) + b),  expressed when LEO >= 0,
#   i.e. when |d| <= sqrt(ln(g / -b)) / w = 1.388
# where d is the difference of x coordinates, computed INSIDE the CPPN by feeding
# x1 and x2 into a gaussian node with weights -w and +w. That is why the CPPN
# needs no separate delta input and keeps HyperNEAT's four inputs.
#
# w = 0.6 and b = -1 come from Huizinga et al. (2014), section 2.1, where LEO
# with gaussian seeding is one of the compared variants.
# g is not given in the source — 2.0 puts the threshold at half the gaussian's height.
link_expression_threshold: 0.0
locality_seed_coordinate_axes: ["x"]
locality_seed_delta_weight: 0.6
locality_seed_gaussian_to_leo_weight: 2.0
locality_seed_bias_weight: -1.0

# CPPN genetics
initial_weight_range_min: -3.0
initial_weight_range_max: 3.0
probability_of_add_node_mutation: 0.03
probability_of_add_connection_mutation: 0.05
probability_of_genome_weight_mutation: 0.80
probability_of_weight_perturbation: 0.90
probability_of_weight_replacement: 0.10
probability_of_toggle_connection_enabled: 0.01
weight_perturbation_magnitude: 0.5

available_activation_functions: ["sigmoid", "gaussian", "sine", "absolute_value", "identity"]
default_activation_function_for_hidden_nodes: sigmoid
default_activation_function_for_output_nodes: identity

compatibility_distance_coefficient_excess_c1: 1.0
compatibility_distance_coefficient_disjoint_c2: 1.0
compatibility_distance_coefficient_weight_difference_c3: 0.4
compatibility_distance_threshold: 3.0

species_elitism_count: 1
species_stagnation_generations_limit: 15
minimum_species_size_for_elitism: 6

probability_of_crossover_vs_mutation_only: 0.75
probability_of_inheriting_from_fitter_parent_for_matching_genes: 0.50
probability_of_interspecies_mating: 0.001

tournament_size_for_parent_selection: 3
species_survival_fraction_for_reproduction: 0.2
