# PolyNEAT – HyperNEAT-LEO na problemie siatkówki
#
# Zadanie jest modularne z definicji: odpowiedź "obiekt po lewej" nie zależy od
# żadnego piksela po prawej (Kashtan & Alon, 2005). LEO zaszczepia lokalność,
# więc pokolenie 0 składa się z dwóch rozłącznych półkul, każdej ze swoim
# wyjściem (Verbancsics & Stanley, 2011).
#
# GEOMETRIA SUBSTRATU — przerwa między półkulami jest KONIECZNA.
# Przy równomiernym rozkładzie ośmiu węzłów na [-1, 1] odległości wewnątrz
# półkuli sięgają 0.857, a między półkulami zaczynają się od 0.286: zakresy się
# nakładają i żaden próg lokalności ich nie rozdzieli.
#
# Przy stałych zaszczepienia ze źródła (w=0.6, g=2.0, b=-1) próg wypada na
# sqrt(ln 2)/0.6 = 1.388. Skupiska ±0.75…±1.0 dają wewnątrz <= 0.25,
# a między >= 1.50 — próg leży czysto pomiędzy.
#
# Kolejność pikseli w warstwie wejściowej, za docstringiem RetinaProblemEvaluator:
#   0,1 = lewa kolumna zewnętrzna lewego bloku (góra, dół)
#   2,3 = kolumna wewnętrzna lewego bloku
#   4,5 = kolumna wewnętrzna prawego bloku
#   6,7 = prawa kolumna zewnętrzna prawego bloku
# Dzięki temu współrzędna x niesie strukturę kolumn, którą reguła zadania czyta.

population_size: 150
number_of_input_nodes: 4      # x1, y1, x2, y2 — jak w zwykłym HyperNEAT
number_of_output_nodes: 2     # waga, LEO
random_seed: 42
device_for_phenotype_evaluation: cpu

initial_population_strategy: leo_seeded

substrate_layer_x_coordinates:
  - [-1.0, -0.9167, -0.8333, -0.75, 0.75, 0.8333, 0.9167, 1.0]
  - [-1.0, -0.9167, -0.8333, -0.75, 0.75, 0.8333, 0.9167, 1.0]
  - [-0.875, 0.875]
substrate_bias_x_coordinate: 0.0
substrate_coordinate_range_min: -1.0
substrate_coordinate_range_max: 1.0
include_substrate_bias_node: true
substrate_node_activation_function: steepened_sigmoid
max_substrate_connection_weight_magnitude: 3.0

# Reguła ekspresji i zaszczepienie lokalnością.
#   LEO = tanh(g * exp(-(w * d)^2) + b),  wyrażone gdy LEO >= 0,
#   czyli gdy |d| <= sqrt(ln(g / -b)) / w = 1.388
# gdzie d to różnica współrzędnych x, liczona WEWNĄTRZ CPPN-a przez podanie x1
# i x2 do węzła gaussowskiego z wagami -w i +w. Dlatego CPPN nie potrzebuje
# osobnego wejścia na deltę i zostaje przy czterech wejściach HyperNEAT-a.
#
# w = 0.6 i b = -1 pochodzą z Huizinga i in. (2014), sekcja 2.1, gdzie LEO
# z zaszczepieniem gaussowskim jest jednym z porównywanych wariantów.
# g nie jest w źródle podane — 2.0 stawia próg na połowie wysokości gaussianu.
link_expression_threshold: 0.0
locality_seed_coordinate_axes: ["x"]
locality_seed_delta_weight: 0.6
locality_seed_gaussian_to_leo_weight: 2.0
locality_seed_bias_weight: -1.0

# Genetyka CPPN
initial_weight_range_min: -3.0
initial_weight_range_max: 3.0
probability_of_add_node_mutation: 0.03
probability_of_add_connection_mutation: 0.05
probability_of_genome_weight_mutation: 0.80
probability_of_weight_perturbation: 0.90
probability_of_weight_replacement: 0.10
probability_of_toggle_connection_enabled: 0.01
weight_perturbation_magnitude: 0.5

available_activation_functions: ["sigmoid", "gaussian", "sine", "absolute_value", "identity"]
default_activation_function_for_hidden_nodes: sigmoid
default_activation_function_for_output_nodes: identity

compatibility_distance_coefficient_excess_c1: 1.0
compatibility_distance_coefficient_disjoint_c2: 1.0
compatibility_distance_coefficient_weight_difference_c3: 0.4
compatibility_distance_threshold: 3.0

species_elitism_count: 1
species_stagnation_generations_limit: 15
minimum_species_size_for_elitism: 6

probability_of_crossover_vs_mutation_only: 0.75
probability_of_inheriting_from_fitter_parent_for_matching_genes: 0.50
probability_of_interspecies_mating: 0.001

tournament_size_for_parent_selection: 3
species_survival_fraction_for_reproduction: 0.2
