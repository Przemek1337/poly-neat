# PolyNEAT – Iris NEAT-DBM classification configuration
# NEAT-DBM (Stanovov et al., 2021) on the Iris dataset: 4 features, 3 classes.
# A single 3-output network is evolved and scored by a softmax-likelihood
# fitness — the smooth analogue of the paper's categorical cross-entropy
# criterion (section 4). Train and test accuracy are reported per the paper's
# Tables 2 and 3. Difference-based mutation recombines each fresh child's
# weights from three donor genomes (paper, section 3).

population_size: 150
number_of_input_nodes: 4
number_of_output_nodes: 3
random_seed: 42
device_for_phenotype_evaluation: cpu

# Mutation rates
probability_of_add_node_mutation: 0.03
probability_of_add_connection_mutation: 0.05
probability_of_weight_perturbation: 0.80
probability_of_weight_replacement: 0.10
probability_of_toggle_connection_enabled: 0.01

# Weight initialization & perturbation
initial_weight_range_min: -1.0
initial_weight_range_max: 1.0
weight_perturbation_strength_sigma: 0.5

# Speciation (compatibility distance coefficients from the original NEAT paper)
compatibility_distance_coefficient_excess_c1: 1.0
compatibility_distance_coefficient_disjoint_c2: 1.0
compatibility_distance_coefficient_weight_difference_c3: 0.4
compatibility_distance_threshold: 3.0

# Species lifecycle
species_elitism_count: 1
species_stagnation_generations_limit: 15
minimum_species_size_for_elitism: 5

# Crossover
probability_of_crossover_vs_mutation_only: 0.75
probability_of_inheriting_from_fitter_parent_for_matching_genes: 0.50
probability_of_interspecies_mating: 0.001

# Parent selection
tournament_size_for_parent_selection: 3
species_survival_fraction_for_reproduction: 0.2

# Activation functions
# Output nodes are linear (identity) so the softmax-likelihood fitness receives
# true logits; hidden nodes default to tanh.
available_activation_functions:
  - sigmoid
  - steepened_sigmoid
  - tanh
  - relu
  - identity
default_activation_function_for_hidden_nodes: tanh
default_activation_function_for_output_nodes: identity

# Difference-based mutation (Stanovov et al., 2021, section 3)
# Probability follows the paper; the scaling factor F is unreported there and
# defaults to the differential-evolution convention of 0.5.
probability_of_difference_based_mutation: 0.1
difference_mutation_scaling_factor: 0.5
