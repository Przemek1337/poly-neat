# Smoke profile: DeepNEAT on the synthetic pediatric pneumonia archive.
#
# A plumbing check at 64 pixels on the CPU, not a measurement. The extra
# preprocessing genes are pinned to their neutral values: the shared image path
# already pads, resizes, augments and standardizes exactly once, and letting a
# genome add a crop, a rescale, a flip or a second normalization on top would
# process the batch twice and mirror a radiograph, which has a left and a right.
protocol:
  protocol_id: pediatric-pneumonia-smoke-synthetic-v1
  dataset_release: synthetic/pediatric-pneumonia-smoke
  dataset_license: not-applicable-synthetic-fixture
  image_side: 64
  split_seed: 11
  search_seed: 101
  retraining_seeds: [201]
  bootstrap_seed: 13
  inference_batch_size: 16
  maximum_phenotype_parameters: 2000000
  uses_augmentation: true

search:
  number_of_generations: 2

algorithm:
  population_size: 4
  number_of_input_nodes: 1
  number_of_output_nodes: 2
  number_of_classes: 2
  random_seed: 101
  device_for_phenotype_evaluation: cpu

  input_image_channels: 1
  input_image_height: 64
  input_image_width: 64

  available_filter_counts: [8, 16]
  available_kernel_sizes: [3]
  available_dense_unit_counts: [16, 32]
  dropout_rate_min: 0.0
  dropout_rate_max: 0.3

  probability_of_add_layer_node_mutation: 0.3
  probability_of_add_tensor_edge_mutation: 0.2
  probability_of_toggle_tensor_edge_mutation: 0.05
  probability_of_layer_hyperparameter_mutation: 0.5
  probability_of_new_conv_layer: 0.8

  # Blocked preprocessing genes: the shared path owns preprocessing.
  global_cropped_image_size_min: 0
  global_cropped_image_size_max: 0
  global_spatial_scaling_min: 0.0
  global_spatial_scaling_max: 0.0
  available_horizontal_flip_options: [false]
  available_variance_normalization_options: [false]
  global_hue_shift_degrees_min: 0.0
  global_hue_shift_degrees_max: 0.0
  global_saturation_value_shift_min: 0.0
  global_saturation_value_shift_max: 0.0
  global_saturation_value_scale_min: 0.0
  global_saturation_value_scale_max: 0.0

  maximum_total_parameter_count: 2000000

candidate_recipe:
  learning_rate: 0.02
  momentum: 0.9
  weight_decay: 0.0005
  batch_size: 16
  number_of_epochs: 2
  schedule: cosine
  minimum_learning_rate: 0.001

track_b_recipe:
  learning_rate: 0.02
  momentum: 0.9
  weight_decay: 0.0005
  batch_size: 16
  number_of_epochs: 3
  schedule: cosine
  minimum_learning_rate: 0.001

bootstrap:
  number_of_replicates: 50
  maximum_attempts: 500
  confidence_level: 0.95
