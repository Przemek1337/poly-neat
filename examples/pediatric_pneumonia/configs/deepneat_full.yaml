# Full profile: DeepNEAT on the real pediatric pneumonia archive, 128 pixels.
#
# NOT YET FROZEN. Every budget below is an input to the pilot, not a result of
# it. The pilot measures what one generation costs on the target device, how
# much memory the largest admissible candidate needs and whether the audit
# reports blocking findings on the real archive; only then are these numbers
# fixed and copied into protocol.lock.yaml, which is what actually freezes a
# result series. A run started from this file before that is a pilot run and
# its numbers are not reportable.
#
# There is no allows_synthetic_archive key here on purpose: this profile
# refuses to invent data and stops unless --data-directory points at the
# extracted download.
#
# The extra preprocessing genes stay pinned exactly as in the smoke profile:
# the shared image path pads, resizes, augments and standardizes once, and a
# genome adding a crop, a rescale, a flip or a second normalization would
# process the batch twice and mirror a radiograph, which has a left and a right.
protocol:
  protocol_id: pediatric-pneumonia-full-v1-pilot
  # Replace both with what the download actually states before any reported
  # run. They are copied verbatim into every run report.
  dataset_release: kaggle/andrewmvd/pediatric-pneumonia-chest-xray
  dataset_license: unverified-confirm-against-the-download

  image_side: 128
  split_seed: 20260905
  search_seed: 101            # the benchmark harness overrides this per repeat
  retraining_seeds: [201, 202, 203]
  bootstrap_seed: 13
  inference_batch_size: 64
  maximum_phenotype_parameters: 5000000   # pilot: confirm against device memory
  search_budget_seconds: 7200             # pilot: confirm against generation cost
  uses_augmentation: true

search:
  number_of_generations: 30   # a cap; the wall-clock budget is what binds

algorithm:
  population_size: 20
  number_of_input_nodes: 1
  number_of_output_nodes: 2
  number_of_classes: 2
  random_seed: 101
  # Ignored by this protocol: it runs search, training and scoring on one
  # device (--cpu/--gpu) so phenotypes cannot end up somewhere other than
  # their batches. Kept because the algorithm config requires it.
  device_for_phenotype_evaluation: cuda

  input_image_channels: 1
  input_image_height: 128
  input_image_width: 128

  available_filter_counts: [16, 32, 64, 128]
  available_kernel_sizes: [3, 5]
  available_dense_unit_counts: [64, 128, 256]
  dropout_rate_min: 0.0
  dropout_rate_max: 0.5

  probability_of_add_layer_node_mutation: 0.3
  probability_of_add_tensor_edge_mutation: 0.2
  probability_of_toggle_tensor_edge_mutation: 0.05
  probability_of_layer_hyperparameter_mutation: 0.5
  probability_of_new_conv_layer: 0.8

  # Blocked preprocessing genes: the shared path owns preprocessing.
  global_cropped_image_size_min: 0
  global_cropped_image_size_max: 0
  global_spatial_scaling_min: 0.0
  global_spatial_scaling_max: 0.0
  available_horizontal_flip_options: [false]
  available_variance_normalization_options: [false]
  global_hue_shift_degrees_min: 0.0
  global_hue_shift_degrees_max: 0.0
  global_saturation_value_shift_min: 0.0
  global_saturation_value_shift_max: 0.0
  global_saturation_value_scale_min: 0.0
  global_saturation_value_scale_max: 0.0

  maximum_total_parameter_count: 5000000

candidate_recipe:
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  batch_size: 64
  number_of_epochs: 8
  schedule: cosine
  minimum_learning_rate: 0.0001

# The one shared recipe every selected topology is retrained under. It must be
# byte-identical across deepneat_full, exact_full, random_search_full and
# fixed_cnn_full: track B exists precisely so that no method gets its own.
track_b_recipe:
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  batch_size: 64
  number_of_epochs: 30
  schedule: cosine
  minimum_learning_rate: 0.0001

bootstrap:
  number_of_replicates: 2000
  maximum_attempts: 20000
  confidence_level: 0.95
