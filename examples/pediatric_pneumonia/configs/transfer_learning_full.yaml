# Full profile: pretrained ResNet-18, reported separately from the search
# comparison, 128 pixels.
#
# NOT YET FROZEN. See deepneat_full.yaml for what the pilot has to settle. There
# is no allows_synthetic_archive key on purpose: this profile refuses to invent
# data and stops unless --data-directory points at the extracted download.
#
# Two things make this baseline non-comparable with the others by construction,
# and both are recorded rather than argued about: the cost of the ImageNet
# pretraining is counted nowhere, and the model brings its own normalization,
# so the shared preprocessing is set to identity standardization instead of
# fitting statistics on the X-rays.
#
# There is no track B. Retraining this topology from scratch would delete the
# pretrained features that are its entire point, so retraining_seeds is empty
# and track_b_recipe is present only because the protocol records it.
protocol:
  protocol_id: pediatric-pneumonia-full-v1-pilot
  # Replace both with what the download actually states before any reported
  # run. They are copied verbatim into every run report.
  dataset_release: kaggle/andrewmvd/pediatric-pneumonia-chest-xray
  dataset_license: unverified-confirm-against-the-download

  image_side: 128
  split_seed: 20260905
  search_seed: 101            # the benchmark harness overrides this per repeat
  retraining_seeds: []
  bootstrap_seed: 13
  inference_batch_size: 64
  maximum_phenotype_parameters: null
  uses_augmentation: true
  uses_identity_standardization: true

transfer_learning:
  weights_identifier: torchvision/resnet18/IMAGENET1K_V1
  unfreezing_policy: head_only
  uses_imagenet_normalization: true

candidate_recipe:
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  batch_size: 64
  number_of_epochs: 10
  schedule: cosine
  minimum_learning_rate: 0.0001

track_b_recipe:
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  batch_size: 64
  number_of_epochs: 10
  schedule: cosine
  minimum_learning_rate: 0.0001

bootstrap:
  number_of_replicates: 2000
  maximum_attempts: 20000
  confidence_level: 0.95
